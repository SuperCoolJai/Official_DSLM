name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd "project-6344747 (1)" && npm install

      - name: Build project
        run: cd "project-6344747 (1)" && npm run build

      - name: Deploy to gh-pages branch
        run: |
          cd "project-6344747 (1)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages || git checkout gh-pages
          git rm -rf .
          cp -r out/* .
          git add .
          git commit -m "Deploy to gh-pages" --allow-empty
          git push origin gh-pages -f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "project-6344747 (1)/out"

  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Disable custom domain to enable standard GitHub Pages
        run: |
          gh api repos/SuperCoolJai/Official_DSLM/pages \
            -H "Accept: application/vnd.github.v3+json" \
            -X DELETE || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
